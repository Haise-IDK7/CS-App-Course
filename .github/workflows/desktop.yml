name: App de escritorio

# Genera los instaladores (Windows .exe, Linux AppImage, macOS .dmg).
# Se ejecuta en cada PR, en cada push a main, al publicar una etiqueta vX.Y.Z y manualmente desde Actions.
# Con una etiqueta v*, además adjunta los instaladores a la versión (Release) de GitHub.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prueba de humo de la app de escritorio
        if: runner.os == 'Linux'
        run: MLC_SMOKE=1 xvfb-run -a npx electron --no-sandbox .
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: guia-cs-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
          if-no-files-found: error
      - name: Adjuntar a la versión publicada
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
